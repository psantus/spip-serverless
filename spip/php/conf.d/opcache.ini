; Lambda optimization: files never change at runtime
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.enable_file_override=1
; JIT for PHP processing speed
opcache.jit=1255
opcache.jit_buffer_size=64M
; Read the build-time pre-warmed opcode cache from /bref/opcache (read-only, PHP 8.5).
; Speeds up cold starts: hot SPIP/vendor files are already compiled in the image.
opcache.file_cache=/bref/opcache
opcache.file_cache_read_only=1
opcache.file_cache_only=1
opcache.use_cwd=0
opcache.file_cache_consistency_checks=0
