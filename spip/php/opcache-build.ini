; Build-time only ini for pre-compiling the opcache file-cache.
; Loaded via `php -c` with PHP_INI_SCAN_DIR="" so the runtime read-only opcache.ini
; is NOT in effect (file_cache_read_only is PHP_INI_SYSTEM, not overridable by -d).
opcache.enable=1
opcache.enable_cli=1
opcache.file_cache=/bref/opcache
opcache.file_cache_only=1
opcache.file_cache_read_only=0
opcache.use_cwd=0
opcache.validate_timestamps=0
opcache.file_cache_consistency_checks=0
